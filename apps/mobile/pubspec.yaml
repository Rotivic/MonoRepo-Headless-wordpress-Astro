name: tcg_platform_mobile
description: A Very Good Project created by Very Good CLI.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.5
  flutter: ^3.41.9

dependencies:
  bloc: ^9.2.1
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.2.0
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  retrofit: ^4.9.2
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  json_serializable: ^6.11.2
  mocktail: ^1.0.4
  retrofit_generator: ^10.2.1
  very_good_analysis: ^10.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icono_signlab.png"
  adaptive_icon_background: "#F6F9FC"
  adaptive_icon_foreground: "assets/images/icono_signlab.png"

flutter_native_splash:
  color: "#533AFD"
  color_dark: "#533AFD"
  image: assets/images/icono_signlab_white.png
  image_dark: assets/images/icono_signlab_white.png
  fullscreen: true

  android_12:
    color: "#533AFD"
    color_dark: "#533AFD"

    image: assets/images/icono_signlab_white.png
    image_dark: assets/images/icono_signlab_white.png
    icon_background_color: "#533AFD"
    icon_background_color_dark: "#533AFD"
