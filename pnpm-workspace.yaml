packages:
  - apps/web

allowBuilds:
  esbuild: true
  sharp: true

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

onlyBuiltDependencies:
  - esbuild
  - sharp

overrides:
  yaml@>=2.0.0 <2.8.3: ^2.8.3

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
