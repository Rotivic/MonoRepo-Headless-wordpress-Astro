services:
  php:
    build: ./docker/php
    container_name: tcg_php
    volumes:
      - ./apps/backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_wp_core:/var/www/html/web/wp
      - backend_plugins:/var/www/html/web/app/plugins
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      WP_MAIL_SMTP_HOST: mailpit
      WP_MAIL_SMTP_PORT: 1025
      WP_MAIL_FROM: no-reply@tcg-platform.local
      WP_MAIL_FROM_NAME: TCG Platform
      PUBLIC_FRONTEND_URL: http://localhost:4321
      WP_LOCALE: ${WP_LOCALE:-es_ES}
    entrypoint: /usr/local/bin/init.sh
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",9000); exit($$s?0:1);'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: tcg_nginx
    ports:
      - "8080:80"
    volumes:
      - ./apps/backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_wp_core:/var/www/html/web/wp
      - backend_plugins:/var/www/html/web/app/plugins
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: node:22-alpine
    container_name: tcg_web
    working_dir: /app
    ports:
      - "4321:4321"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      WORDPRESS_API_URL: http://nginx/wp-json
      PUBLIC_WORDPRESS_API_URL: http://localhost:8080/wp-json
      PUBLIC_ENABLE_SHOP: ${PUBLIC_ENABLE_SHOP:-true}
      PUBLIC_ENABLE_BLOG: ${PUBLIC_ENABLE_BLOG:-true}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4321/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mobile-tools:
    image: ${FLUTTER_DOCKER_IMAGE:-ghcr.io/cirruslabs/flutter:stable}
    container_name: tcg_mobile_tools
    profiles:
      - mobile
    working_dir: /workspace/apps/mobile
    volumes:
      - ./:/workspace
      - mobile_pub_cache:/root/.pub-cache
      - mobile_gradle_cache:/root/.gradle
    environment:
      PUB_CACHE: /root/.pub-cache
      TCG_API_URL: http://10.0.2.2:8080/wp-json
    command: tail -f /dev/null

  db:
    image: mysql:8.0
    container_name: tcg_db
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tcg_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    container_name: tcg_mailpit
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  db-admin:
    image: adminer:latest
    container_name: tcg_db_admin
    profiles:
      - tools
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  backend_vendor:
  backend_wp_core:
  backend_plugins:
  web_node_modules:
  mobile_pub_cache:
  mobile_gradle_cache:
